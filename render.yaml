services:
  - type: web
    name: compound-cafe
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
    disk:
      name: compound-cafe-data
      mountPath: /opt/render/project/src
      sizeGB: 1
